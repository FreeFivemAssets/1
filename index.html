<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield Anticheat</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e4e7ec;--ac:#2563eb;--bad:#dc2626;--warn:#d97706;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mut:#8b949e;--bd:#30363d;--ac:#58a6ff;--bad:#f85149;--warn:#d29922;--ok:#3fb950}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0}main{max-width:1100px;margin:0 auto;padding:24px;display:grid;gap:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
.stat b{display:block;font-size:26px}.stat span,.mut{color:var(--mut)}
h2{font-size:15px;margin:0 0 12px}.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:500}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.flag{color:var(--warn)}.ban{color:var(--bad)}.unban{color:var(--ok)}
input,button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:4px 8px}
form{display:flex;gap:8px;flex-wrap:wrap}#login{max-width:340px;margin:12vh auto}#app{display:none}
</style>
</head>
<body>
<div id="login" class="card">
  <h1>Shield Anticheat</h1><p class="mut">Enter the dashboard password.</p>
  <form id="lf"><input id="pw" type="password" placeholder="Password" required><button>Sign in</button></form>
  <p id="err" class="ban"></p>
</div>
<div id="app">
<header><h1>🛡️ Shield Anticheat</h1><button class="s" id="out">Sign out</button></header>
<main>
  <div class="stats">
    <div class="card stat"><b id="s1">0</b><span>Events (last 200)</span></div>
    <div class="card stat"><b id="s2">0</b><span>Flags</span></div>
    <div class="card stat"><b id="s3">0</b><span>Active bans</span></div>
    <div class="card stat"><b id="s4">0</b><span>Bans (24h)</span></div>
  </div>
  <div class="card"><h2>Manual action</h2>
    <form id="mf"><input id="mid" placeholder="license:abc123… or any identifier" size="36" required>
    <input id="mr" placeholder="Reason" size="24">
    <button>Ban</button><button type="button" class="s" id="kick">Kick</button></form>
    <p class="mut">Commands reach the game server within ~15 seconds.</p></div>
  <div class="card"><h2>Active bans</h2><div class="wrap"><table id="bt"></table></div></div>
  <div class="card"><h2>Recent events</h2><div class="wrap"><table id="et"></table></div></div>
</main></div>
<script>
const $ = s => document.querySelector(s);
let pass = sessionStorage.getItem('pw') || '', timer;
const api = (path, opt = {}) => fetch(path, { ...opt, headers: { 'Content-Type': 'application/json', 'x-dash-pass': pass } });

// All values go through textContent: player names are attacker-controlled.
function row(cells, head) {
  const tr = document.createElement('tr');
  cells.forEach(c => {
    const el = document.createElement(head ? 'th' : 'td');
    if (c instanceof Node) el.appendChild(c); else el.textContent = c ?? '';
    tr.appendChild(el);
  });
  return tr;
}
function tag(type) { const s = document.createElement('span'); s.className = 'tag ' + type; s.textContent = type; return s; }
function fill(t, head, rows) { t.replaceChildren(row(head, true), ...rows); }
const fmt = ms => new Date(ms).toLocaleString();

async function send(action, id, reason) {
  await api('/api/commands', { method: 'POST', body: JSON.stringify({ action, id, reason }) });
  alert('Queued: ' + action + ' ' + id);
}

async function load() {
  const r = await api('/api/data');
  if (r.status === 401) { sessionStorage.removeItem('pw'); $('#app').style.display = 'none'; $('#login').style.display = ''; clearInterval(timer); return false; }
  const d = await r.json();
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  $('#s1').textContent = d.events.length;
  $('#s2').textContent = d.events.filter(e => e.type === 'flag').length;
  $('#s3').textContent = d.bans.length;
  $('#s4').textContent = d.bans.filter(b => Date.now() - b.t < 864e5).length;
  fill($('#bt'), ['When', 'Player', 'Identifier', 'Reason', ''], d.bans.map(b => {
    const btn = document.createElement('button'); btn.className = 's'; btn.textContent = 'Unban';
    btn.onclick = () => confirm('Unban ' + b.id + '?') && send('unban', b.id);
    return row([fmt(b.t), b.player, b.id, b.reason, btn]);
  }));
  fill($('#et'), ['When', 'Type', 'Server', 'Player', 'Identifier', 'Reason', 'Strikes'],
    d.events.map(e => row([fmt(e.t), tag(e.type), e.server, e.player, e.id, e.reason, e.strikes || ''])));
  return true;
}
function start() { load(); clearInterval(timer); timer = setInterval(load, 10000); }

$('#lf').onsubmit = async e => {
  e.preventDefault(); pass = $('#pw').value;
  if (await load()) { sessionStorage.setItem('pw', pass); start(); } else $('#err').textContent = 'Wrong password.';
};
$('#mf').onsubmit = e => { e.preventDefault(); send('ban', $('#mid').value.trim(), $('#mr').value); };
$('#kick').onclick = () => $('#mid').value && send('kick', $('#mid').value.trim(), $('#mr').value);
$('#out').onclick = () => { sessionStorage.removeItem('pw'); location.reload(); };
if (pass) start();
</script>
</body>
</html>
